<header class="topbar">

    <!-- BUSCADOR -->
    <div class="search-box">

        <i class="bi bi-search"></i>

        <input
            type="text"
            id="searchInput"
            placeholder="Buscar..."
            autocomplete="off"
        >

        <span class="search-shortcut">
            Ctrl K
        </span>

    </div>


    <!-- ACCIONES -->
    <div class="topbar-actions">

        <button
            type="button"
            class="topbar-button"
            title="Cambiar tema"
        >
            <i class="bi bi-sun"></i>
        </button>


        <button
            type="button"
            class="topbar-button"
            title="Notificaciones"
        >
            <i class="bi bi-bell"></i>

            <span class="notification-dot"></span>
        </button>


        <!-- USUARIO -->
        <div class="user-profile">

            <div
                class="user-avatar"
                id="topUserAvatar"
            >
                U
            </div>

        </div>

    </div>

</header>
